<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل أوامر التصنيع المتقدم</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #1e293b;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 300px;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            border-left: 1px solid #1e293b;
            flex-shrink: 0;
            overflow: hidden;
            transition: 0.3s;
        }

        .sidebar .logo {
            font-size: 22px;
            font-weight: 700;
            color: #facc15;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar .logo span {
            color: #94a3b8;
            font-weight: 400;
            font-size: 14px;
        }

        .sidebar .search-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #334155;
            transition: 0.2s;
        }

        .sidebar .search-box:focus-within {
            border-color: #facc15;
            background: #1e293b;
        }

        .sidebar .search-box input {
            background: transparent;
            border: none;
            color: #f1f5f9;
            width: 100%;
            font-size: 14px;
            outline: none;
        }

        .sidebar .search-box input::placeholder {
            color: #64748b;
        }

        .sidebar .product-list {
            flex: 1;
            overflow-y: auto;
            padding-left: 4px;
            margin-top: 4px;
        }

        .sidebar .product-list::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar .product-list::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .sidebar .product-list::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .product-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 13px;
            border-right: 3px solid transparent;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-item:hover {
            background: #1e293b;
        }

        .product-item.active {
            background: #1e293b;
            border-right-color: #facc15;
            color: #facc15;
            font-weight: 500;
        }

        .sidebar .product-count {
            font-size: 12px;
            color: #64748b;
            padding: 10px 4px 0;
            border-top: 1px solid #1e293b;
            margin-top: 12px;
            text-align: center;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px 28px;
            background: #f8fafc;
        }

        /* Header */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .main-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #0f172a;
        }

        .main-header .product-badge {
            background: #e2e8f0;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: white;
            padding: 6px 16px 6px 10px;
            border-radius: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .date-controls select {
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 13px;
            outline: none;
            max-width: 140px;
        }

        .date-controls button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }

        .date-controls button:hover {
            background: #1e293b;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: white;
            padding: 16px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f6;
            transition: 0.2s;
        }

        .kpi-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .kpi-card .label {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .kpi-card .value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
            color: #0f172a;
        }

        .kpi-card .value.gold {
            color: #b45309;
        }
        .kpi-card .value.blue {
            color: #1e3a8a;
        }
        .kpi-card .value.green {
            color: #15803d;
        }
        .kpi-card .value.red {
            color: #b91c1c;
        }
        .kpi-card .value.purple {
            color: #6d28d9;
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .chart-box {
            background: white;
            border-radius: 16px;
            padding: 18px 20px 12px;
            border: 1px solid #eef2f6;
            display: flex;
            flex-direction: column;
        }

        .chart-box h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .chart-box .canvas-wrap {
            flex: 1;
            position: relative;
            min-height: 180px;
        }

        /* Table */
        .table-section {
            background: white;
            border-radius: 16px;
            border: 1px solid #eef2f6;
            padding: 18px 20px 12px;
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .table-section .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-section .table-header h4 {
            font-size: 15px;
            font-weight: 600;
        }

        .table-section .table-header button {
            background: #f1f5f9;
            border: none;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }

        .table-section .table-header button:hover {
            background: #e2e8f0;
        }

        .table-scroll {
            overflow-y: auto;
            flex: 1;
        }

        .table-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            padding: 8px 10px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td {
            padding: 6px 10px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .month-col {
            text-align: right;
            font-weight: 500;
            color: #1e293b;
        }

        .qty-high {
            font-weight: 600;
            color: #0f172a;
        }

        .qty-zero {
            color: #cbd5e1;
        }

        .no-data {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
            font-size: 14px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 18px;
            color: #64748b;
            gap: 12px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #e2e8f0;
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                width: 240px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
            }
            .sidebar {
                width: 100%;
                height: 300px;
                border-left: none;
                border-bottom: 1px solid #1e293b;
            }
            .main {
                padding: 16px;
                height: auto;
            }
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }
            .table-section {
                flex: 1 1 auto;
                min-height: 250px;
            }
            .date-controls {
                width: 100%;
                justify-content: center;
                border-radius: 20px;
            }
            .date-controls select {
                max-width: 100px;
            }
        }

        @media (max-width: 480px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            .main-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            📊 تحليلات
            <span>v2.0</span>
        </div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="productSearch" placeholder="ابحث عن منتج..." />
        </div>
        <div class="product-list" id="productList"></div>
        <div class="product-count" id="productCount">0 منتج</div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="mainContent">
        <!-- Loading -->
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <span>جاري تحميل البيانات ...</span>
        </div>

        <!-- Dashboard (hidden initially) -->
        <div id="dashboard" style="display:none; flex:1; display:none; flex-direction:column; height:100%;">

            <div class="main-header">
                <div>
                    <h2 id="selectedProductName">المنتج</h2>
                    <span class="product-badge" id="productBadge">اختر منتجاً من القائمة</span>
                </div>
                <div class="date-controls">
                    <label style="font-size:13px; color:#475569;">من</label>
                    <select id="monthFrom"></select>
                    <label style="font-size:13px; color:#475569;">إلى</label>
                    <select id="monthTo"></select>
                    <button id="applyBtn">تطبيق</button>
                    <button id="resetBtn" style="background:#e2e8f0;color:#1e293b;">↺</button>
                </div>
            </div>

            <!-- KPIs -->
            <div class="kpi-grid" id="kpiGrid">
                <div class="kpi-card"><div class="label">📦 الإجمالي</div><div class="value gold" id="kpiTotal">—</div></div>
                <div class="kpi-card"><div class="label">📈 المتوسط</div><div class="value blue" id="kpiAvg">—</div></div>
                <div class="kpi-card"><div class="label">⬆ الأعلى</div><div class="value green" id="kpiMax">—</div></div>
                <div class="kpi-card"><div class="label">⬇ الأدنى</div><div class="value red" id="kpiMin">—</div></div>
                <div class="kpi-card"><div class="label">📅 أشهر (صفر)</div><div class="value purple" id="kpiNonZero">—</div></div>
                <div class="kpi-card"><div class="label">📌 آخر شهر</div><div class="value" id="kpiLast" style="font-size:20px;">—</div></div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="chart-box">
                    <h4>📈 الاتجاه الزمني</h4>
                    <div class="canvas-wrap"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <h4>📊 التوزيع الشهري</h4>
                    <div class="canvas-wrap"><canvas id="barChart"></canvas></div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-section">
                <div class="table-header">
                    <h4>📋 البيانات التفصيلية</h4>
                    <button id="exportCsv">⬇ تصدير CSV</button>
                </div>
                <div class="table-scroll" id="tableScroll">
                    <table>
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="no-data" id="tableEmpty">⚠️ لا توجد بيانات للفترة المحددة</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        let MONTHS = [];
        let PRODUCTS = {};
        let productNames = [];
        let currentProduct = '';
        let fromIdx = 0;
        let toIdx = 0;
        let lineChartInstance = null;
        let barChartInstance = null;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const productList = $('productList');
        const productSearch = $('productSearch');
        const monthFrom = $('monthFrom');
        const monthTo = $('monthTo');
        const applyBtn = $('applyBtn');
        const resetBtn = $('resetBtn');
        const loadingIndicator = $('loadingIndicator');
        const dashboard = $('dashboard');
        const selectedProductName = $('selectedProductName');
        const productBadge = $('productBadge');
        const tableHead = $('tableHead');
        const tableBody = $('tableBody');
        const tableEmpty = $('tableEmpty');
        const exportBtn = $('exportCsv');

        // ============================================================
        //  LOAD DATA
        // ============================================================
        async function loadData() {
            try {
                const res = await fetch('data.json');
                if (!res.ok) throw new Error('فشل تحميل data.json');
                const json = await res.json();
                MONTHS = json.months;
                PRODUCTS = json.products;
                productNames = Object.keys(PRODUCTS).sort((a, b) => a.localeCompare(b, 'ar'));
                return true;
            } catch (e) {
                console.error(e);
                loadingIndicator.innerHTML = `
                    <div style="color:#b91c1c; text-align:center;">
                        <div style="font-size:40px;">⚠️</div>
                        <p style="margin-top:12px;">تعذر تحميل الملف <strong>data.json</strong></p>
                        <p style="font-size:14px; color:#64748b;">تأكد من وجود الملف في نفس المجلد، واستخدم خادم محلي (مثل Live Server).</p>
                    </div>
                `;
                return false;
            }
        }

        // ============================================================
        //  RENDER SIDEBAR
        // ============================================================
        function renderSidebar(filter = '') {
            const f = filter.trim().toLowerCase();
            const filtered = productNames.filter(p => p.toLowerCase().includes(f));
            productList.innerHTML = '';
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = `product-item ${p === currentProduct ? 'active' : ''}`;
                div.textContent = p;
                div.title = p;
                div.addEventListener('click', () => {
                    currentProduct = p;
                    renderSidebar(productSearch.value);
                    updateDashboard();
                });
                productList.appendChild(div);
            });
            document.getElementById('productCount').textContent = `${filtered.length} منتج`;
        }

        // ============================================================
        //  POPULATE MONTH SELECTORS
        // ============================================================
        function populateMonths() {
            monthFrom.innerHTML = '';
            monthTo.innerHTML = '';
            MONTHS.forEach((m, i) => {
                const o1 = document.createElement('option');
                o1.value = i;
                o1.textContent = m;
                monthFrom.appendChild(o1);
                const o2 = document.createElement('option');
                o2.value = i;
                o2.textContent = m;
                monthTo.appendChild(o2);
            });
            monthFrom.value = 0;
            monthTo.value = MONTHS.length - 1;
            fromIdx = 0;
            toIdx = MONTHS.length - 1;
        }

        // ============================================================
        //  UPDATE DASHBOARD
        // ============================================================
        function updateDashboard() {
            if (!currentProduct || !PRODUCTS[currentProduct]) {
                // show empty
                return;
            }
            const data = PRODUCTS[currentProduct];
            const from = parseInt(monthFrom.value) || 0;
            const to = parseInt(monthTo.value) || MONTHS.length - 1;
            const slice = data.slice(from, to + 1);

            // Update header
            selectedProductName.textContent = currentProduct;
            productBadge.textContent = `${MONTHS[from]} → ${MONTHS[to]}`;

            // Stats
            const total = slice.reduce((a, b) => a + b, 0);
            const avg = total / slice.length;
            const max = Math.max(...slice);
            const min = Math.min(...slice.filter(v => v > 0).concat([0]));
            const nonZero = slice.filter(v => v > 0).length;
            const lastVal = slice[slice.length - 1] || 0;

            $('kpiTotal').textContent = total.toLocaleString('ar', { maximumFractionDigits: 0 });
            $('kpiAvg').textContent = avg.toLocaleString('ar', { maximumFractionDigits: 1 });
            $('kpiMax').textContent = max.toLocaleString('ar', { maximumFractionDigits: 0 });
            $('kpiMin').textContent = min.toLocaleString('ar', { maximumFractionDigits: 0 });
            $('kpiNonZero').textContent = nonZero;
            $('kpiLast').textContent = lastVal.toLocaleString('ar', { maximumFractionDigits: 0 });

            // Table
            tableHead.innerHTML = `<tr><th style="text-align:right;">الشهر</th><th>الكمية</th></tr>`;
            tableBody.innerHTML = '';
            let hasData = false;
            for (let i = from; i <= to; i++) {
                const val = data[i] || 0;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align:right;font-weight:500;">${MONTHS[i]}</td>
                    <td class="${val === 0 ? 'qty-zero' : 'qty-high'}">${val.toLocaleString('ar', { maximumFractionDigits: 1 })}</td>
                `;
                tableBody.appendChild(tr);
                if (val > 0) hasData = true;
            }
            tableEmpty.style.display = hasData ? 'none' : 'block';

            // Charts
            const labels = MONTHS.slice(from, to + 1);
            const values = slice;

            // Line
            if (lineChartInstance) { lineChartInstance.destroy();
                lineChartInstance = null; }
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: currentProduct, data: values, borderColor: '#0f172a',
                        backgroundColor: 'rgba(15,23,42,0.07)', fill: true, tension: 0.3,
                        pointRadius: 2, borderWidth: 2.5 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#eef2f6' } },
                    x: { grid: { display: false }, ticks: { maxRotation: 25, autoSkip: true,
                            maxTicksLimit: 20 } } }
                }
            });

            // Bar
            if (barChartInstance) { barChartInstance.destroy();
                barChartInstance = null; }
            const ctxBar = document.getElementById('barChart').getContext('2d');
            let barLabels = labels,
                barValues = values;
            if (labels.length > 25) {
                const step = Math.ceil(labels.length / 20);
                barLabels = labels.filter((_, i) => i % step === 0);
                barValues = values.filter((_, i) => i % step === 0);
            }
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: barLabels,
                    datasets: [{ label: currentProduct, data: barValues, backgroundColor: 'rgba(15,23,42,0.65)',
                        borderRadius: 4, borderColor: '#0f172a', borderWidth: 1 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: '#eef2f6' } },
                    x: { grid: { display: false }, ticks: { maxRotation: 30, autoSkip: true,
                            maxTicksLimit: 18 } } }
                }
            });

            // highlight active in sidebar
            document.querySelectorAll('.product-item').forEach(el => {
                el.classList.toggle('active', el.textContent === currentProduct);
            });
        }

        // ============================================================
        //  EXPORT CSV
        // ============================================================
        function exportCSV() {
            if (!currentProduct || !PRODUCTS[currentProduct]) return alert('اختر منتجاً أولاً');
            const from = parseInt(monthFrom.value) || 0;
            const to = parseInt(monthTo.value) || MONTHS.length - 1;
            const data = PRODUCTS[currentProduct];
            let csv = 'الشهر,الكمية\n';
            for (let i = from; i <= to; i++) {
                csv += `${MONTHS[i]},${data[i] || 0}\n`;
            }
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${currentProduct.replace(/[^a-zA-Z0-9]/g,'_')}_data.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            const ok = await loadData();
            if (!ok) return;

            populateMonths();
            renderSidebar('');
            if (productNames.length > 0) {
                currentProduct = productNames[0];
            }

            // Show dashboard
            loadingIndicator.style.display = 'none';
            dashboard.style.display = 'flex';

            updateDashboard();

            // Events
            productSearch.addEventListener('input', () => renderSidebar(productSearch.value));
            applyBtn.addEventListener('click', updateDashboard);
            resetBtn.addEventListener('click', () => {
                monthFrom.value = 0;
                monthTo.value = MONTHS.length - 1;
                updateDashboard();
            });
            exportBtn.addEventListener('click', exportCSV);

            // Month sync
            monthFrom.addEventListener('change', () => {
                if (parseInt(monthFrom.value) > parseInt(monthTo.value)) {
                    monthTo.value = monthFrom.value;
                }
            });
            monthTo.addEventListener('change', () => {
                if (parseInt(monthTo.value) < parseInt(monthFrom.value)) {
                    monthFrom.value = monthTo.value;
                }
            });

            // Resize charts
            window.addEventListener('resize', () => {
                if (lineChartInstance) lineChartInstance.resize();
                if (barChartInstance) barChartInstance.resize();
            });
        }

        init();
    </script>

</body>
</html>
